<ion-content [fullscreen]="true" class="auth-bg">
  <div class="auth-wrap">

    <div class="brand">
      <img src="assets/VayGoLogoWhite.png" alt="VayGo" />
      <h1>Welcome VayGo User</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="card">
      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <label class="field-label">Mobile number</label>
        <ion-item lines="none" class="field">
          <span class="prefix">+91</span>
          <ion-input
            type="tel"
            inputmode="numeric"
            maxlength="10"
            formControlName="mobile"
            placeholder="10-digit number">
          </ion-input>
        </ion-item>

        <ion-text color="danger"
          *ngIf="loginForm.get('mobile')?.touched && loginForm.get('mobile')?.invalid">
          <p *ngIf="loginForm.get('mobile')?.errors?.['required']">Mobile number is required</p>
          <p *ngIf="loginForm.get('mobile')?.errors?.['pattern']">Enter valid 10-digit number</p>
        </ion-text>

        <ion-text color="danger" *ngIf="errormessage">
          <p class="ion-text-center">{{ errormessage }}</p>
        </ion-text>

        <label class="privacy-check">
          <input type="checkbox" [(ngModel)]="acceptedPrivacy" [ngModelOptions]="{ standalone: true }" />
          <span>I have read and accept the
            <a class="link" (click)="goToPrivacy(); $event.preventDefault()">Privacy Policy</a>.
          </span>
        </label>

        <ion-button expand="block" class="submit" type="submit" [disabled]="!acceptedPrivacy">
          Send OTP
        </ion-button>
      </form>

      <p class="note">
        Don't have an account?
        <a class="link" (click)="goToRegister()">Create one</a>
      </p>
    </div>

    <p class="app-version">Version {{ appVersion }}</p>

  </div>
</ion-content>
